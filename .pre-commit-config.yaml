# Fast local checks only - the full build/cppcheck run in CI instead, to keep
# every commit sub-second (frequent small commits matter for this project).
#
# Setup: pip install -r requirements-dev.txt && pre-commit install
# Run on demand: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc)$

  - repo: local
    hooks:
      - id: banned-patterns
        name: banned patterns (malloc/new/delete/virtual/STL, float printf)
        entry: scripts/check-banned-patterns.sh
        language: script
        files: \.(c|h|cpp|hpp|cc)$
        pass_filenames: false
