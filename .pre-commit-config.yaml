# Fast local checks only - the full build/cppcheck run in CI instead, to keep
# every commit sub-second (frequent small commits matter for this project).
#
# Setup: pip install -r requirements-dev.txt && pre-commit install
# Run on demand: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        files: \.(c|h|cpp|hpp|cc)$

  - repo: local
    hooks:
      - id: banned-patterns
        name: banned patterns (malloc/new/delete/virtual/STL, float printf)
        entry: scripts/check-banned-patterns.sh
        language: script
        files: \.(c|h|cpp|hpp|cc)$
        pass_filenames: false
      - id: pin-map
        name: pin map (duplicate pins, notes, static_asserts, peripheral owners)
        entry: scripts/check-pin-map.py
        language: script
        files: ^(include/RobotConfig\.h|src/.*)$
        pass_filenames: false
      - id: isr-atomicity
        name: ISR atomicity (multi-byte volatiles only inside ISR / ATOMIC_BLOCK)
        entry: scripts/check-isr-atomicity.py
        language: script
        files: ^src/.*\.(c|h|cpp|hpp)$
        pass_filenames: false
      - id: docs-drift
        name: docs drift (module docs, ADR numbering, testing guide)
        entry: scripts/check-docs-drift.py
        language: script
        files: ^(src/hal/.*\.cpp|docs/.*|scripts/[^/]+\.(py|sh)|platformio\.ini)$
        pass_filenames: false
