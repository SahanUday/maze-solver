; ============================================================================
;  Maze Solver Challenge 2026 - build configuration
;  Docs: https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
; Pressing "Build" in VS Code builds this env unless you pick another.
default_envs = mega


; Shared by every environment via extends = common
[common]
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
; These are src-only on purpose: build_flags would also hit the Arduino core
; and the PlatformIO-downloaded libraries. lib/maze opts in via its own
; library.json. -fno-exceptions makes the ban on exceptions a compiler error
; rather than a convention; -fno-rtti does the same for RTTI but is env:mega
; only, see there.
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -fno-exceptions


; Arduino Mega 2560, ATmega2560 @ 16 MHz. 256 KB flash / 8 KB SRAM / 4 KB EEPROM
; The platform and its packages are pinned so a toolchain release can't change
; what CI builds. Bump deliberately, in its own PR. (Pins match what CI cached.)
[env:mega]
platform  = atmelavr@5.3.0
platform_packages =
    platformio/framework-arduino-avr@5.4.0
    platformio/toolchain-atmelavr@1.70300.191015
board     = megaatmega2560
framework = arduino
extends   = common

; Both of these are env:mega-only. -Wstack-usage is meaningless against the
; host's stack budget. -fno-rtti (no typeinfo in flash) is a C++-only option,
; and src flags reach Unity's unity_config.c in env:native, where GCC's
; "valid for C++ but not for C" warning plus -Werror fails the build; src/ here
; is all C++. A dynamic_cast under lib/maze therefore passes env:native and
; fails this build - CI gate requires both, so it is still caught on the PR.
; NOTE: extends replaces build_src_flags, not merges - must re-include
; ${common.build_src_flags} explicitly.
build_src_flags =
    ${common.build_src_flags}
    -fno-rtti
    -Wstack-usage=128

; Must match DEBUG_SERIAL_BAUD in include/RobotSpec.h.
monitor_speed = 250000
upload_speed  = 115200      ; bootloader speed - do not raise

; Pinned versions, added as each driver arrives (MPU-6050).
lib_deps =


; ----------------------------------------------------------------------------
;  Host PC build. lib/maze must not include Arduino.h.
;  `pio test -e native` to run; extends = common for build-flag parity.
; ----------------------------------------------------------------------------
[env:native]
platform = native@1.2.1
extends   = common


; Same tests under AddressSanitizer + UBSan. -O1 keeps the stack traces usable;
; recovery is off so the first violation fails the run instead of printing.
; extends replaces build_flags, so ${common.build_flags} is repeated here.
[env:native_san]
platform = native@1.2.1
extends   = common
build_flags =
    ${common.build_flags}
    -O1
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all


; Same tests with gcov instrumentation, read by gcovr in CI (scripts/check-coverage.sh).
[env:native_cov]
platform = native@1.2.1
extends   = common
build_flags =
    ${common.build_flags}
    -O0
    -g
    --coverage
    -lgcov


; ----------------------------------------------------------------------------
;  Bench probes (tools/probe/): throwaway firmware for measuring parameters on the robot.
;  Not part of the mission build. Examples:
;    pio run -e probe_sensors -t upload    sensors streamed as CSV, motors off
;    pio run -e probe_motion  -t upload    serial-driven motion tests, motors off until commanded
;    pio run -e probe_ir      -t upload    the IR array: raw statistics, a calibration capture, a live view
; ----------------------------------------------------------------------------
[probe]
platform  = atmelavr@5.3.0
platform_packages =
    platformio/framework-arduino-avr@5.4.0
    platformio/toolchain-atmelavr@1.70300.191015
board     = megaatmega2560
framework = arduino
extends   = common
monitor_speed = 250000
upload_speed  = 115200
upload_port   = /dev/ttyACM0

[env:probe_sensors]
extends = probe
build_src_filter =
    -<*>
    +<hal/>
    +<../tools/probe/sensors.cpp>

[env:probe_motion]
extends = probe
build_src_filter =
    -<*>
    +<hal/>
    +<line_cal_store.cpp>
    +<../tools/probe/motion.cpp>

[env:probe_ir]
extends = probe
build_src_filter =
    -<*>
    +<hal/>
    +<../tools/probe/ir.cpp>
