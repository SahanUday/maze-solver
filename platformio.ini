; PlatformIO Project Configuration File
;
; Bare-metal register-level AVR C++ build for the Arduino Mega 2560 (ATmega2560).
; Deliberately no `framework =` line: we don't use the Arduino core/HAL at all,
; only avr-gcc/avr-g++ + avr-libc (<avr/io.h>, <util/delay.h>, ...). Our own
; main.cpp provides int main(void); avr-libc's crt0 startup calls it directly
; (main() is exempt from C++ name mangling, so no extern "C" is needed).
;
; C++ here means a restricted "embedded C++" subset, not full modern C++:
; no exceptions, no RTTI, no virtual functions/dynamic dispatch, no STL
; containers, no heap allocation. See .claude/skills/embedded-code-architecture
; for the reasoning. -fno-exceptions/-fno-rtti below enforce the first two at
; the compiler level; the rest are enforced by scripts/check-banned-patterns.sh.
;
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560

; Warnings-as-errors: any real bug (unused var, implicit narrowing conversion,
; shadowed variable, accidental float/double promotion) fails the build instead
; of silently compiling. See .claude/skills/avr-c-speed-optimization and
; avr-c-memory-efficiency for the reasoning behind -Wdouble-promotion in
; particular (catches float creeping into integer/fixed-point code).
build_flags =
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wdouble-promotion
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
