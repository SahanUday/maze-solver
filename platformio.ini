; ============================================================================
;  Maze Solver Challenge 2026 - build configuration
;  Docs: https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
; Pressing "Build" in VS Code builds this env unless you pick another.
default_envs = mega


; ----------------------------------------------------------------------------
;  Settings shared by every environment.
;  Envs inherit these with  extends = common
; ----------------------------------------------------------------------------
[common]
build_flags =
    -std=gnu++17            ; C++17: constexpr, enum class, structured bindings
build_unflags =
    -std=gnu++11            ; remove the Arduino core default, else it wins
build_src_flags =
    -Wall                   ; warn on the usual mistakes
    -Wextra                 ; and on the less usual ones
    -Werror=return-type     ; a function that forgets to return is an ERROR


; ----------------------------------------------------------------------------
;  The robot. Arduino Mega 2560, ATmega2560 @ 16 MHz.
;  256 KB flash / 8 KB SRAM / 4 KB EEPROM
; ----------------------------------------------------------------------------
[env:mega]
platform  = atmelavr
board     = megaatmega2560
framework = arduino
extends   = common

; Serial. 250000 is an exact divisor of 16 MHz, so it has 0.0% baud error,
; unlike 115200 (-3.5%). Needed for logging telemetry at 50 Hz (TOOL-01).
; Must match DEBUG_SERIAL_BAUD in include/RobotSpec.h - an .ini file can't
; include a C++ header, so this is the one place that constant can't be the
; single source of truth. Change both together.
monitor_speed = 250000
upload_speed  = 115200      ; the bootloader's speed - do not raise

; Libraries are pinned to exact versions so a rebuild months from now
; produces the same firmware. Added as each driver arrives:
;   HW-01  -> MPU-6050 (gyro)
;   TOOL-01 -> SdFat (logging)
lib_deps =


; ----------------------------------------------------------------------------
;  Host PC build. No Arduino framework, so lib/ code that includes it will
;  not compile here - that restriction is what keeps lib/maze (mapping,
;  exploration, path-finding: SIM-01) hardware-independent, and lets its
;  unit tests run on a laptop with no robot attached.
;
;  default_envs above means plain `pio run` still targets the Mega only;
;  use `pio test -e native` to build and run the native test suite.
;
;  extends = common so this env stays at build-flag parity with env:mega -
;  without it, a C++17 construct or a missing-return that env:mega's
;  -Werror=return-type would catch could pass native tests silently under a
;  different standard/warning set.
; ----------------------------------------------------------------------------
[env:native]
platform = native
extends   = common
