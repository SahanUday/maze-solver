; ============================================================================
;  Maze Solver Challenge 2026 - build configuration
;  Docs: https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
; Pressing "Build" in VS Code builds this env unless you pick another.
default_envs = mega


; Shared by every environment via extends = common
[common]
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags =
    -Wall
    -Wextra
    -Werror=return-type


; Arduino Mega 2560, ATmega2560 @ 16 MHz. 256 KB flash / 8 KB SRAM / 4 KB EEPROM
[env:mega]
platform  = atmelavr
board     = megaatmega2560
framework = arduino
extends   = common

; -Wstack-usage is env:mega-only (meaningless on native's host stack budget).
; NOTE: extends replaces build_src_flags, not merges - must re-include
; ${common.build_src_flags} explicitly.
build_src_flags =
    ${common.build_src_flags}
    -Wstack-usage=128

; Must match DEBUG_SERIAL_BAUD in include/RobotSpec.h.
monitor_speed = 250000
upload_speed  = 115200      ; bootloader speed - do not raise

; Pinned versions, added as each driver arrives (MPU-6050, SdFat).
lib_deps =


; ----------------------------------------------------------------------------
;  Host PC build. lib/maze must not include Arduino.h.
;  `pio test -e native` to run; extends = common for build-flag parity.
; ----------------------------------------------------------------------------
[env:native]
platform = native
extends   = common
